# Gerenciado pelo Traefik Control. Comentários e formatação feitos à mão
# são preservados; só as entradas editadas pelo painel são reescritas.
http:
  routers:
    meu-app:
      rule: Host(`app.exemplo.com`)
      service: meu-app
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    meu-app:
      loadBalancer:
        servers:
          - url: http://10.0.0.9:8080
        passHostHeader: true
